<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Altyazı Dublaj</title>
<style>
  :root { --bg:#101214; --panel:#1a1e22; --line:#2c3238; --text:#e8eaec; --dim:#98a2ab; --acc:#3ddc97; --warn:#ffb454; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 system-ui, sans-serif; }
  .wrap { max-width:900px; margin:0 auto; padding:10px; }
  #stage { position:relative; background:#000; border-radius:8px; overflow:hidden; min-height:120px; margin:0 auto; }
  #video { display:block; width:100%; height:auto; }
  #box { position:absolute; border:3px solid var(--acc); background:rgba(61,220,151,.15); touch-action:none; display:none; }
  #handle { position:absolute; right:-18px; bottom:-18px; width:44px; height:44px; border-radius:50%; background:var(--acc); border:3px solid #06281a; touch-action:none; }
  #dbg { color:var(--dim); font-size:13px; margin-top:6px; word-break:break-word; }
  #ver { color:var(--dim); font-size:12px; text-align:center; margin-top:10px; }
  #hint { position:absolute; left:8px; top:8px; background:rgba(0,0,0,.6); padding:4px 8px; border-radius:6px; font-size:13px; color:var(--dim); }
  .row { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  button { flex:1; min-width:120px; padding:14px 10px; font-size:16px; font-weight:600; border:1px solid var(--line); border-radius:8px; background:var(--panel); color:var(--text); }
  button.main { background:var(--acc); color:#06281a; border-color:var(--acc); }
  button.on { background:#e5534b; color:#fff; border-color:#e5534b; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; margin-top:10px; }
  #tr { font-size:22px; font-weight:600; min-height:1.4em; }
  #en { color:var(--dim); font-size:14px; margin-top:6px; min-height:1.4em; }
  #status { color:var(--warn); font-size:13px; margin-top:8px; }
  label { display:block; font-size:14px; color:var(--dim); margin-top:12px; }
  input[type=range], select, input[type=password] { width:100%; margin-top:6px; }
  select, input[type=password] { padding:10px; background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:6px; font-size:15px; }
  #prev { width:100%; margin-top:8px; border:1px solid var(--line); border-radius:6px; background:#fff; image-rendering:pixelated; }
  details summary { cursor:pointer; font-weight:600; }
  small { color:var(--dim); }
</style>
</head>
<body>
<div class="wrap">
  <div id="stage">
    <video id="video" playsinline muted></video>
    <div id="box"><div id="handle"></div></div>
    <div id="hint">Yeşil kutuyu altyazının üstüne sürükle, köşedeki yuvarlaktan boyutlandır</div>
  </div>

  <div class="row">
    <button id="btnCam">Kamerayı aç</button>
    <button id="btnRun" class="main" disabled>Başlat</button>
  </div>

  <div class="card">
    <div id="tr">—</div>
    <div id="en"></div>
    <div id="status">Hazır değil</div>
  </div>

  <div class="card">
    <small>Programın gördüğü (altyazı siyah, zemin beyaz olmalı):</small>
    <canvas id="prev" width="600" height="120"></canvas>
    <div id="dbg"></div>
  </div>

  <details class="card">
    <summary>Ayarlar</summary>

    <label><input id="auto" type="checkbox" style="width:auto"> Yazı eşiğini otomatik ayarla</label>
    <label>Elle yazı eşiği: <span id="thV"></span> 
      <input id="th" type="range" min="90" max="240" step="5">
    </label>
    <label id="zoomL" style="display:none">Yakınlaştırma: <span id="zoomV"></span>
      <input id="zoom" type="range">
    </label>

    <label>Konuşma hızı: <span id="rateV"></span>
      <input id="rate" type="range" min="0.8" max="1.8" step="0.1">
    </label>

    <label>Ses
      <select id="voice"></select>
    </label>
    <div class="row"><button id="btnTest">Sesi dene</button></div>

    <label>Yapay zekâ çeviri anahtarı (isteğe bağlı, Claude API)
      <input id="key" type="password" placeholder="Boşsa ücretsiz çeviri kullanılır" autocomplete="off">
    </label>
    <small>Anahtar sadece bu cihazda saklanır. Girilirse argo ve espriler daha doğal çevrilir.</small>
  </details>
  <div id="ver">sürüm 3</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var video = $('video'), stage = $('stage'), box = $('box'), statusEl = $('status');
  var work = document.createElement('canvas'), wctx = work.getContext('2d', { willReadFrequently: true });
  var prev = $('prev'), pctx = prev.getContext('2d');

  function load(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  var region = load('region2', { x: 0.1, y: 0.7, w: 0.8, h: 0.14 });
  var lastTh = 0;
  var cfg = { auto: load('auto', true), th: load('th', 170), rate: load('rate', 1.2), voice: load('voice', ''), key: load('key', '') };
  var running = false, busy = false, worker = null, timer = null, wake = null;
  var lastSpoken = '', candidate = '', cache = new Map();

  function status(t) { statusEl.textContent = t; }
  function dbg(t) { $('dbg').textContent = t; }

  /* ---------- bölge seçimi ---------- */
  function drawBox() {
    var W = video.clientWidth, H = video.clientHeight;
    if (!W || !H) { box.style.display = 'none'; return; }
    box.style.display = 'block';
    box.style.left = region.x * W + 'px'; box.style.top = region.y * H + 'px';
    box.style.width = region.w * W + 'px'; box.style.height = region.h * H + 'px';
  }
  var drag = null;
  box.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    drag = { mode: e.target.id === 'handle' ? 'size' : 'move', px: e.clientX, py: e.clientY, r: Object.assign({}, region) };
    box.setPointerCapture(e.pointerId);
  });
  box.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var dx = (e.clientX - drag.px) / video.clientWidth, dy = (e.clientY - drag.py) / video.clientHeight, r = drag.r;
    if (drag.mode === 'move') {
      region.x = Math.min(1 - r.w, Math.max(0, r.x + dx));
      region.y = Math.min(1 - r.h, Math.max(0, r.y + dy));
    } else {
      region.w = Math.min(1 - r.x, Math.max(0.15, r.w + dx));
      region.h = Math.min(1 - r.y, Math.max(0.03, r.h + dy));
    }
    drawBox();
  });
  function endDrag() { if (!drag) return; drag = null; save('region2', region); $('hint').style.display = 'none'; }
  box.addEventListener('pointerup', endDrag);
  box.addEventListener('pointercancel', endDrag);
  function fitStage() {
    if (!video.videoWidth) return;
    var maxH = window.innerHeight * 0.55;
    stage.style.maxWidth = Math.round(maxH * video.videoWidth / video.videoHeight) + 'px';
    drawBox();
  }
  window.addEventListener('resize', fitStage);

  /* ---------- kamera ---------- */
  $('btnCam').onclick = async function () {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      status('Bu adreste kamera açılamıyor. Sayfa https:// ile başlayan bir adresten açılmalı.'); return;
    }
    try {
      var s = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }
      });
      video.srcObject = s; await video.play();
      fitStage(); $('btnRun').disabled = false; $('btnCam').textContent = 'Kamera açık';
      status('Yeşil kutuyu altyazının üstüne getir, sonra Başlat');
      try {
        var track = s.getVideoTracks()[0], caps = track.getCapabilities ? track.getCapabilities() : {};
        if (caps.zoom && caps.zoom.max > caps.zoom.min) {
          var z = $('zoom'); z.min = caps.zoom.min; z.max = Math.min(caps.zoom.max, 8); z.step = caps.zoom.step || 0.1; z.value = caps.zoom.min;
          $('zoomL').style.display = 'block'; $('zoomV').textContent = z.value + 'x';
          z.oninput = function () { $('zoomV').textContent = Number(z.value).toFixed(1) + 'x'; track.applyConstraints({ advanced: [{ zoom: Number(z.value) }] }).catch(function () {}); };
        }
      } catch (e) {}
      previewLoop();
    } catch (e) { status('Kamera açılamadı: ' + e.message); }
  };

  /* ---------- görüntü işleme ---------- */
  // Bölgeyi kırpar, siyah-beyaza çevirir. Dönen değer: yazı pikseli oranı.
  function grab() {
    var vw = video.videoWidth, vh = video.videoHeight;
    if (!vw) return 0;
    var sx = region.x * vw, sy = region.y * vh, sw = region.w * vw, sh = region.h * vh;
    var scale = Math.min(2, 1100 / sw);
    work.width = Math.max(8, Math.round(sw * scale)); work.height = Math.max(8, Math.round(sh * scale));
    wctx.drawImage(video, sx, sy, sw, sh, 0, 0, work.width, work.height);
    var img = wctx.getImageData(0, 0, work.width, work.height), d = img.data, N = d.length / 4;
    var gray = new Uint8Array(N), hist = new Array(256).fill(0), i, g;
    for (i = 0; i < N; i++) {
      g = (d[i * 4] * 3 + d[i * 4 + 1] * 6 + d[i * 4 + 2]) / 10 | 0;
      gray[i] = g; hist[g]++;
    }
    var th = cfg.th;
    if (cfg.auto) {
      // Otsu: görüntüyü "parlak yazı" ve "zemin" diye en iyi ayıran eşiği bul
      var sum = 0, t; for (t = 0; t < 256; t++) sum += t * hist[t];
      var sumB = 0, wB = 0, best = 0, bestT = 128, mB = 0, mF = 0;
      for (t = 0; t < 256; t++) {
        wB += hist[t]; if (!wB) continue;
        var wF = N - wB; if (!wF) break;
        sumB += t * hist[t];
        var a = sumB / wB, b = (sum - sumB) / wF, v = wB * wF * (a - b) * (a - b);
        if (v > best) { best = v; bestT = t; mB = a; mF = b; }
      }
      th = (mF - mB < 30) ? 256 : bestT;      // kontrast yoksa yazı yok say
    }
    lastTh = th;
    var n = 0;
    for (i = 0; i < N; i++) {
      var val = gray[i] > th ? 0 : 255;       // parlak yazı -> siyah, gerisi beyaz
      if (!val) n++;
      d[i * 4] = d[i * 4 + 1] = d[i * 4 + 2] = val;
    }
    wctx.putImageData(img, 0, 0);
    return n / N;
  }
  function previewLoop() {
    if (!running && video.videoWidth) { grab(); showPrev(); }
    setTimeout(previewLoop, 500);
  }
  function showPrev() {
    prev.height = Math.max(20, Math.round(prev.width * work.height / work.width));
    pctx.drawImage(work, 0, 0, prev.width, prev.height);
  }

  /* ---------- metin yardımcıları ---------- */
  function clean(t) {
    return t.replace(/\s+/g, ' ').replace(/[^A-Za-z0-9 .,!?'"$%&:;\-()]/g, '').replace(/\s+/g, ' ').trim();
  }
  function norm(t) { return t.toLowerCase().replace(/[^a-z0-9]/g, ''); }
  function lev(a, b) {
    var m = a.length, n = b.length, p = [], i, j;
    for (j = 0; j <= n; j++) p[j] = j;
    for (i = 1; i <= m; i++) {
      var last = p[0]; p[0] = i;
      for (j = 1; j <= n; j++) {
        var t = p[j];
        p[j] = Math.min(p[j] + 1, p[j - 1] + 1, last + (a[i - 1] === b[j - 1] ? 0 : 1));
        last = t;
      }
    }
    return p[n];
  }
  function same(a, b) {
    a = norm(a); b = norm(b);
    if (!a || !b) return false;
    if (a === b || a.indexOf(b) >= 0 || b.indexOf(a) >= 0) return true;
    return 1 - lev(a, b) / Math.max(a.length, b.length) > 0.75;
  }
  function looksLikeText(t) {
    if (t.length < 4) return false;
    var letters = (t.match(/[A-Za-z]/g) || []).length;
    return letters / t.length > 0.6 && /[A-Za-z]{2,}/.test(t);
  }

  /* ---------- çeviri ---------- */
  async function translate(text) {
    var k = norm(text);
    if (cache.has(k)) return cache.get(k);
    var out;
    if (cfg.key) {
      var r = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'content-type': 'application/json', 'x-api-key': cfg.key,
          'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model: 'claude-haiku-5-5', max_tokens: 200,
          system: 'Bir video oyununun İngilizce altyazı satırını doğal, günlük konuşma Türkçesine çevir. Metin kameradan okunduğu için küçük yazım hataları olabilir, anlamı tahmin et. Sadece çeviriyi yaz, açıklama ekleme.',
          messages: [{ role: 'user', content: text }]
        })
      });
      if (!r.ok) throw new Error('Çeviri servisi ' + r.status);
      var j = await r.json(); out = j.content[0].text.trim();
    } else {
      var r2 = await fetch('https://api.mymemory.translated.net/get?langpair=en|tr&q=' + encodeURIComponent(text.slice(0, 450)));
      if (!r2.ok) throw new Error('Çeviri servisi ' + r2.status);
      var j2 = await r2.json(); out = (j2.responseData && j2.responseData.translatedText) || '';
      if (!out || /MYMEMORY WARNING/i.test(out)) throw new Error('Ücretsiz çeviri günlük sınırı doldu');
    }
    cache.set(k, out);
    if (cache.size > 500) cache.delete(cache.keys().next().value);
    return out;
  }

  /* ---------- seslendirme ---------- */
  var voices = [];
  function fillVoices() {
    voices = speechSynthesis.getVoices().filter(function (v) { return /^tr/i.test(v.lang); });
    var sel = $('voice'); sel.innerHTML = '';
    if (!voices.length) { sel.innerHTML = '<option value="">Varsayılan Türkçe ses</option>'; return; }
    voices.forEach(function (v) {
      var o = document.createElement('option'); o.value = v.name; o.textContent = v.name; sel.appendChild(o);
    });
    if (cfg.voice) sel.value = cfg.voice;
  }
  function speak(text) {
    if (!('speechSynthesis' in window)) return;
    if (speechSynthesis.pending) speechSynthesis.cancel();   // birikme olmasın, en yenisini söyle
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'tr-TR'; u.rate = cfg.rate;
    var v = voices.find(function (x) { return x.name === cfg.voice; });
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  }
  if ('speechSynthesis' in window) { fillVoices(); speechSynthesis.onvoiceschanged = fillVoices; }

  /* ---------- ana döngü ---------- */
  async function tick() {
    if (!running || busy) return;
    busy = true;
    try {
      var ratio = grab(); showPrev();
      if (ratio < 0.004) { candidate = ''; dbg('Kutuda yazı görünmüyor (kontrast düşük)'); return; }
      if (ratio > 0.45) { candidate = ''; dbg('Kutunun zemini çok parlak, yazı ayrılamıyor: kutuyu daralt'); return; }
      var res = await worker.recognize(work);
      var text, conf, lines = res.data.lines;
      if (lines && lines.length) {
        var good = lines.map(function (l) { return { t: clean(l.text), c: l.confidence }; })
                        .filter(function (l) { return l.c >= 55 && looksLikeText(l.t); });
        text = good.map(function (l) { return l.t; }).join(' ');
        conf = good.length ? good.reduce(function (a, l) { return a + l.c; }, 0) / good.length : res.data.confidence;
        if (!good.length) text = clean(res.data.text);
      } else { text = clean(res.data.text); conf = res.data.confidence; }
      dbg('Okunan: ' + (text || '(boş)') + '  [güven %' + Math.round(conf) + ']');
      if (!looksLikeText(text) || conf < 45) return;
      if (same(text, lastSpoken)) return;
      // düşük güvenli okumayı ikinci okumayla doğrula
      if (conf < 75 && !same(text, candidate)) { candidate = text; return; }
      candidate = ''; lastSpoken = text;
      $('en').textContent = text;
      var tr = await translate(text);
      if (!running) return;
      $('tr').textContent = tr; speak(tr); status('Çalışıyor');
    } catch (e) { status('Hata: ' + e.message); }
    finally { busy = false; }
  }

  $('btnRun').onclick = async function () {
    var b = $('btnRun');
    if (running) {
      running = false; clearInterval(timer); speechSynthesis.cancel();
      if (wake) { try { wake.release(); } catch (e) {} wake = null; }
      b.textContent = 'Başlat'; b.className = 'main'; status('Durduruldu'); return;
    }
    speak('Hazır');                       // ses iznini dokunuşla aç
    if (!worker) {
      if (!window.Tesseract) { status('Yazı tanıma yüklenemedi, interneti kontrol et'); return; }
      status('Yazı tanıma yükleniyor (ilk açılışta 10-20 sn)...'); b.disabled = true;
      try {
        worker = await Tesseract.createWorker('eng');
        await worker.setParameters({ tessedit_pageseg_mode: '6' });
      } catch (e) { status('Yazı tanıma başlatılamadı: ' + e.message); b.disabled = false; return; }
      b.disabled = false;
    }
    try { if (navigator.wakeLock) wake = await navigator.wakeLock.request('screen'); } catch (e) {}
    running = true; lastSpoken = ''; candidate = '';
    b.textContent = 'Durdur'; b.className = 'on'; status('Çalışıyor, altyazı bekleniyor');
    timer = setInterval(tick, 350);
  };

  /* ---------- ayarlar ---------- */
  function bind(id, key, fmt) {
    var el = $(id); el.value = cfg[key];
    var show = function () { if ($(id + 'V')) $(id + 'V').textContent = fmt ? fmt(cfg[key]) : cfg[key]; };
    el.oninput = function () { cfg[key] = el.type === 'range' ? Number(el.value) : el.value.trim(); save(key, cfg[key]); show(); };
    show();
  }
  bind('th', 'th'); bind('rate', 'rate', function (v) { return v.toFixed(1) + 'x'; }); bind('key', 'key');
  $('auto').checked = cfg.auto;
  $('auto').onchange = function () { cfg.auto = $('auto').checked; save('auto', cfg.auto); };
  $('voice').onchange = function () { cfg.voice = $('voice').value; save('voice', cfg.voice); };
  $('btnTest').onclick = function () { speak('Merhaba, altyazıları sana Türkçe okuyacağım.'); };
})();
</script>
</body>
</html>
